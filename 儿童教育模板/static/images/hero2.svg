<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="classroom-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="board" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5a27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a17;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#classroom-bg)"/>
  <!-- Classroom wall -->
  <rect x="100" y="100" width="1720" height="700" rx="20" fill="#F5DEB3" opacity="0.9"/>
  <!-- Blackboard -->
  <rect x="300" y="150" width="1320" height="300" rx="15" fill="url(#board)"/>
  <!-- Board content -->
  <text x="960" y="250" text-anchor="middle" font-size="48" fill="white" font-family="sans-serif">A B C D E F G</text>
  <text x="960" y="320" text-anchor="middle" font-size="36" fill="#FFD700" font-family="sans-serif">1 2 3 4 5 6 7</text>
  <!-- Drawings on board -->
  <circle cx="400" cy="380" r="20" fill="red" opacity="0.7"/>
  <rect x="500" y="360" width="40" height="40" fill="blue" opacity="0.7"/>
  <polygon points="600,400 620,350 640,400" fill="green" opacity="0.7"/>
  <!-- Shelves -->
  <rect x="150" y="500" width="200" height="15" fill="#8B4513"/>
  <rect x="150" y="550" width="200" height="15" fill="#8B4513"/>
  <circle cx="200" cy="490" r="10" fill="#FF6B6B"/>
  <rect x="230" y="475" width="20" height="25" rx="3" fill="#4ECDC4"/>
  <circle cx="270" cy="490" r="10" fill="#FFD93D"/>
  <circle cx="200" cy="540" r="10" fill="#A855F7"/>
  <rect x="240" y="525" width="25" height="20" rx="3" fill="#FF6B6B"/>
  <!-- Right shelf -->
  <rect x="1570" y="500" width="200" height="15" fill="#8B4513"/>
  <rect x="1570" y="550" width="200" height="15" fill="#8B4513"/>
  <circle cx="1620" cy="490" r="10" fill="#4ECDC4"/>
  <rect x="1650" y="475" width="20" height="25" rx="3" fill="#FFD93D"/>
  <circle cx="1690" cy="490" r="10" fill="#FF6B6B"/>
  <!-- Floor -->
  <rect y="800" width="1920" height="280" fill="#DEB887"/>
  <!-- Carpet -->
  <ellipse cx="960" cy="850" rx="400" ry="80" fill="#FF6B6B" opacity="0.3"/>
  <!-- Children sitting -->
  <!-- Child 1 -->
  <circle cx="700" cy="780" r="25" fill="#FFDAB9"/>
  <rect x="675" y="805" width="50" height="80" rx="10" fill="#FF6B6B"/>
  <line x1="685" y1="885" x2="680" y2="920" stroke="#FFDAB9" stroke-width="6"/>
  <line x1="715" y1="885" x2="720" y2="920" stroke="#FFDAB9" stroke-width="6"/>
  <!-- Child 2 -->
  <circle cx="850" cy="770" r="23" fill="#FFDAB9"/>
  <rect x="827" y="793" width="46" height="75" rx="10" fill="#4ECDC4"/>
  <line x1="837" y1="868" x2="832" y2="900" stroke="#FFDAB9" stroke-width="6"/>
  <line x1="863" y1="868" x2="868" y2="900" stroke="#FFDAB9" stroke-width="6"/>
  <!-- Child 3 -->
  <circle cx="1000" cy="775" r="24" fill="#FFDAB9"/>
  <rect x="976" y="799" width="48" height="78" rx="10" fill="#FFD93D"/>
  <line x1="986" y1="877" x2="981" y2="910" stroke="#FFDAB9" stroke-width="6"/>
  <line x1="1014" y1="877" x2="1019" y2="910" stroke="#FFDAB9" stroke-width="6"/>
  <!-- Child 4 -->
  <circle cx="1150" cy="780" r="25" fill="#FFDAB9"/>
  <rect x="1125" y="805" width="50" height="80" rx="10" fill="#A855F7"/>
  <line x1="1135" y1="885" x2="1130" y2="920" stroke="#FFDAB9" stroke-width="6"/>
  <line x1="1165" y1="885" x2="1170" y2="920" stroke="#FFDAB9" stroke-width="6"/>
  <!-- Teacher -->
  <circle cx="960" cy="700" r="28" fill="#FFDAB9"/>
  <rect x="932" y="728" width="56" height="90" rx="10" fill="#3B82F6"/>
  <line x1="942" y1="818" x2="935" y2="855" stroke="#FFDAB9" stroke-width="7"/>
  <line x1="978" y1="818" x2="985" y2="855" stroke="#FFDAB9" stroke-width="7"/>
  <!-- Teacher pointing -->
  <line x1="988" y1="750" x2="1050" y2="720" stroke="#FFDAB9" stroke-width="5"/>
  <!-- Books and toys on floor -->
  <rect x="600" y="890" width="40" height="30" rx="3" fill="#FF6B6B" transform="skewX(-10)"/>
  <rect x="660" y="895" width="35" height="25" rx="3" fill="#4ECDC4" transform="skewX(-10)"/>
  <circle cx="1300" cy="900" r="15" fill="#FFD93D"/>
  <rect x="1330" y="885" width="30" height="30" rx="5" fill="#A855F7"/>
  <!-- Decorations -->
  <text x="200" y="200" font-size="60" opacity="0.3">⭐</text>
  <text x="1700" y="250" font-size="50" opacity="0.3">🌈</text>
  <text x="250" y="400" font-size="40" opacity="0.3">📚</text>
  <text x="1650" y="420" font-size="45" opacity="0.3">🎨</text>
</svg>